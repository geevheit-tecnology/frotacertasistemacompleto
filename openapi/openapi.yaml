openapi: 3.1.0
info:
  title: Fleet Intelligence API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /v1/auth/login:
    post:
      summary: Autentica usuario ativo e emite Bearer token
      tags: [Auth]
      responses:
        "200":
          description: Token emitido
  /v1/auth/me:
    get:
      summary: Retorna usuario autenticado
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
  /v1/companies:
    get:
      summary: Lista empresas no escopo do grupo
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empresas paginadas
    post:
      summary: Cria empresa no grupo do usuario autenticado
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Empresa criada
  /v1/branches:
    get:
      summary: Lista filiais no escopo da empresa
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Filiais paginadas
    post:
      summary: Cria filial na empresa do usuario autenticado
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Filial criada
  /v1/users:
    get:
      summary: Lista usuarios no escopo da empresa
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuarios paginados
    post:
      summary: Cria usuario interno no escopo da empresa
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Usuario criado
  /v1/vehicles:
    get:
      summary: Lista veiculos no escopo autorizado
      tags: [Vehicles]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista paginada de veiculos
    post:
      summary: Cria veiculo
      tags: [Vehicles]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Veiculo criado
  /v1/drivers:
    get:
      summary: Lista motoristas no escopo autorizado
      tags: [Drivers]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista paginada de motoristas
    post:
      summary: Cria motorista no escopo autorizado
      tags: [Drivers]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Motorista criado
  /v1/vehicle-documents:
    get:
      summary: Lista documentos de veiculos
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documentos paginados
    post:
      summary: Cria documento de veiculo
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Documento criado
  /v1/driver-documents:
    get:
      summary: Lista documentos de motoristas
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documentos paginados
    post:
      summary: Cria documento de motorista
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Documento criado
  /v1/checklist-templates:
    get:
      summary: Lista modelos de checklist para app mobile
      tags: [Checklists]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates paginados
    post:
      summary: Cria modelo de checklist
      tags: [Checklists]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Template criado
  /v1/checklists:
    get:
      summary: Lista execucoes de checklist
      tags: [Checklists]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checklists paginados
    post:
      summary: Registra checklist executado pelo app mobile
      tags: [Checklists]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Checklist registrado com respostas e nao conformidades
        "422":
          description: Hodometro inconsistente
  /v1/checklists/{id}:
    get:
      summary: Retorna checklist com respostas e nao conformidades
      tags: [Checklists]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Checklist encontrado
  /v1/non-conformities:
    get:
      summary: Lista nao conformidades geradas por checklist
      tags: [Checklists]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nao conformidades paginadas
  /v1/non-conformities/{id}:
    get:
      summary: Retorna nao conformidade
      tags: [Checklists]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Nao conformidade encontrada
    patch:
      summary: Atualiza status da nao conformidade
      tags: [Checklists]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Nao conformidade atualizada
  /v1/oil-services:
    get:
      summary: Lista registros de troca de oleo no escopo autorizado
      tags: [Maintenance]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registros paginados
    post:
      summary: Registra troca de oleo e retorna projecao preventiva
      tags: [Maintenance]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Troca registrada com projecao calculada
  /v1/oil-services/{id}:
    get:
      summary: Retorna troca de oleo com projecao preventiva
      tags: [Maintenance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Registro encontrado
    patch:
      summary: Atualiza troca de oleo e sincroniza alerta preventivo
      tags: [Maintenance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Registro atualizado
    delete:
      summary: Remove registro de troca de oleo
      tags: [Maintenance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "204":
          description: Registro removido
  /v1/maintenance-plans:
    get:
      summary: Lista planos preventivos por KM, tempo ou horimetro
      tags: [PreventiveMaintenance]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Planos preventivos paginados
    post:
      summary: Cria regra preventiva configuravel
      tags: [PreventiveMaintenance]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Plano preventivo criado
        "422":
          description: Nenhum intervalo preventivo configurado
  /v1/maintenance-plans/{id}:
    get:
      summary: Retorna plano preventivo no escopo autorizado
      tags: [PreventiveMaintenance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Plano preventivo encontrado
    patch:
      summary: Atualiza plano preventivo
      tags: [PreventiveMaintenance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Plano preventivo atualizado
    delete:
      summary: Remove plano preventivo
      tags: [PreventiveMaintenance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "204":
          description: Plano preventivo removido
  /v1/tachographs:
    get:
      summary: Lista tacografos por validade e veiculo
      tags: [Tachographs]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tacografos paginados
    post:
      summary: Registra tacografo e sincroniza alerta preventivo
      tags: [Tachographs]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Tacografo registrado
  /v1/tachographs/{id}:
    get:
      summary: Retorna tacografo no escopo autorizado
      tags: [Tachographs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Tacografo encontrado
    patch:
      summary: Atualiza tacografo e recalcula alerta preventivo
      tags: [Tachographs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Tacografo atualizado
    delete:
      summary: Remove tacografo
      tags: [Tachographs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "204":
          description: Tacografo removido
  /v1/suppliers:
    get:
      summary: Lista oficinas e fornecedores
      tags: [Suppliers]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fornecedores paginados
    post:
      summary: Cria oficina ou fornecedor
      tags: [Suppliers]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Fornecedor criado
  /v1/inventory-parts:
    get:
      summary: Lista pecas em estoque
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pecas paginadas
    post:
      summary: Cria peca em estoque
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Peca criada
  /v1/work-orders:
    get:
      summary: Lista ordens de servico
      tags: [WorkOrders]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ordens de servico paginadas
    post:
      summary: Abre ordem de servico preventiva ou corretiva
      tags: [WorkOrders]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Ordem de servico criada
  /v1/work-orders/{id}/parts:
    post:
      summary: Consome peca do estoque na ordem de servico
      tags: [WorkOrders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Ordem recalculada com baixa de estoque
        "422":
          description: Estoque insuficiente
  /v1/tires:
    get:
      summary: Lista pneus por status ou veiculo
      tags: [Tires]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pneus paginados
    post:
      summary: Cadastra pneu com numero de fogo e ciclo de vida
      tags: [Tires]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Pneu cadastrado
  /v1/tires/{id}:
    get:
      summary: Retorna pneu no escopo autorizado
      tags: [Tires]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Pneu encontrado
  /v1/tire-inspections:
    get:
      summary: Lista inspecoes de pneus
      tags: [Tires]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inspecoes paginadas
    post:
      summary: Registra inspecao e sincroniza alerta preventivo
      tags: [Tires]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Inspecao registrada
  /v1/fuel-records:
    get:
      summary: Lista abastecimentos por escopo operacional
      tags: [Fuel]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Abastecimentos paginados
    post:
      summary: Registra abastecimento e gera transacao financeira
      tags: [Fuel]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Abastecimento registrado
  /v1/financial-transactions:
    get:
      summary: Lista transacoes financeiras
      tags: [Financial]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transacoes paginadas
    post:
      summary: Cria transacao financeira manual
      tags: [Financial]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Transacao criada
  /v1/cost-centers:
    get:
      summary: Lista centros de custo
      tags: [Financial]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Centros de custo paginados
    post:
      summary: Cria centro de custo
      tags: [Financial]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Centro de custo criado
  /v1/invoices:
    get:
      summary: Lista notas fiscais
      tags: [Invoices]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notas fiscais paginadas
    post:
      summary: Cadastra nota fiscal e gera transacao financeira
      tags: [Invoices]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Nota fiscal cadastrada
  /v1/reports/vehicles/{id}/costs:
    get:
      summary: Retorna custo e TCO inicial por veiculo
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Resumo de custo por veiculo
  /v1/reports/executive:
    get:
      summary: Retorna relatorio executivo consolidado
      tags: [Reports]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Indicadores executivos de frota, risco, operacao e custos
  /v1/audit-logs:
    get:
      summary: Lista logs de auditoria por escopo
      tags: [Audit]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logs de auditoria paginados
  /v1/audit-logs/export.csv:
    get:
      summary: Exporta logs de auditoria em CSV
      tags: [Audit]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Arquivo CSV de auditoria
  /v1/alerts:
    get:
      summary: Lista alertas por prioridade operacional
      tags: [Alerts]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista paginada de alertas
  /v1/alerts/{id}:
    get:
      summary: Retorna alerta no escopo autorizado
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Alerta encontrado
    patch:
      summary: Atualiza status ou responsavel do alerta
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Alerta atualizado
  /v1/alerts/{id}/tasks:
    post:
      summary: Cria tarefa operacional a partir de um alerta
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "201":
          description: Tarefa criada a partir do alerta
  /v1/insights:
    get:
      summary: Lista insights preventivos explicaveis
      tags: [Insights]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista paginada de insights
  /v1/insights/{id}:
    get:
      summary: Retorna insight no escopo autorizado
      tags: [Insights]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Insight encontrado
    patch:
      summary: Atualiza status do insight preventivo
      tags: [Insights]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Insight atualizado
  /v1/mission-control:
    get:
      summary: Retorna indicadores operacionais consolidados
      tags: [MissionControl]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Snapshot da central de controle
  /v1/rules:
    get:
      summary: Lista regras configuraveis
      tags: [Workflow]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Regras paginadas
    post:
      summary: Cria regra auditavel de workflow
      tags: [Workflow]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Regra criada
  /v1/rules/{id}/execute:
    post:
      summary: Executa regra e grava resultado idempotente
      tags: [Workflow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "201":
          description: Execucao registrada
  /v1/rule-executions:
    get:
      summary: Lista execucoes de regras
      tags: [Workflow]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Execucoes paginadas
  /v1/tasks:
    get:
      summary: Lista tarefas operacionais
      tags: [Tasks]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tarefas paginadas
  /v1/tasks/{id}:
    get:
      summary: Retorna tarefa operacional
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Tarefa encontrada
    patch:
      summary: Atualiza status, responsavel ou prazo da tarefa
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Tarefa atualizada
  /v1/notifications:
    get:
      summary: Lista notificacoes internas
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notificacoes paginadas
  /v1/evidences:
    get:
      summary: Lista evidencias anexadas por entidade
      tags: [Evidences]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Evidencias paginadas
    post:
      summary: Registra referencia de evidencia armazenada
      tags: [Evidences]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Evidencia registrada
  /health:
    get:
      summary: Verifica se a aplicacao responde
      tags: [Observability]
      responses:
        "200":
          description: Aplicacao saudavel
  /ready:
    get:
      summary: Verifica dependencias obrigatorias
      tags: [Observability]
      responses:
        "200":
          description: Dependencias prontas
components:
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Severity:
      type: string
      enum: [INFO, ATENCAO, MEDIO, ALTO, CRITICO]
    AlertStatus:
      type: string
      enum: [ABERTO, VISUALIZADO, EM_ANALISE, EM_EXECUCAO, RESOLVIDO, IGNORADO, CANCELADO]
