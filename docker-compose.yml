services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: frotacerta_dev
      DB_USERNAME: fleet
      DB_PASSWORD: fleet
      REDIS_HOST: redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frotacerta_dev
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

volumes:
  postgres_data:
