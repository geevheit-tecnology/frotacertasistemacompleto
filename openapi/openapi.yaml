openapi: 3.1.0
info:
  title: Fleet Intelligence API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /v1/auth/login:
    post:
      summary: Autentica usuario ativo e emite Bearer token
      tags: [Auth]
      responses:
        "200":
          description: Token emitido
  /v1/auth/me:
    get:
      summary: Retorna usuario autenticado
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
  /v1/companies:
    get:
      summary: Lista empresas no escopo do grupo
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empresas paginadas
    post:
      summary: Cria empresa no grupo do usuario autenticado
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Empresa criada
  /v1/branches:
    get:
      summary: Lista filiais no escopo da empresa
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Filiais paginadas
    post:
      summary: Cria filial na empresa do usuario autenticado
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Filial criada
  /v1/users:
    get:
      summary: Lista usuarios no escopo da empresa
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuarios paginados
    post:
      summary: Cria usuario interno no escopo da empresa
      tags: [Administration]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Usuario criado
  /v1/vehicles:
    get:
      summary: Lista veiculos no escopo autorizado
      tags: [Vehicles]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista paginada de veiculos
    post:
      summary: Cria veiculo
      tags: [Vehicles]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Veiculo criado
  /v1/drivers:
    get:
      summary: Lista motoristas no escopo autorizado
      tags: [Drivers]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista paginada de motoristas
    post:
      summary: Cria motorista no escopo autorizado
      tags: [Drivers]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Motorista criado
  /v1/vehicle-documents:
    get:
      summary: Lista documentos de veiculos
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documentos paginados
    post:
      summary: Cria documento de veiculo
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Documento criado
  /v1/driver-documents:
    get:
      summary: Lista documentos de motoristas
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documentos paginados
    post:
      summary: Cria documento de motorista
      tags: [Documents]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Documento criado
  /alerts:
    get:
      summary: Lista alertas por prioridade operacional
      tags: [Alerts]
      responses:
        "200":
          description: Lista paginada de alertas
  /insights:
    get:
      summary: Lista insights explicaveis
      tags: [Insights]
      responses:
        "200":
          description: Lista paginada de insights
  /v1/mission-control:
    get:
      summary: Retorna indicadores operacionais consolidados
      tags: [MissionControl]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Snapshot da central de controle
  /health:
    get:
      summary: Verifica se a aplicacao responde
      tags: [Observability]
      responses:
        "200":
          description: Aplicacao saudavel
  /ready:
    get:
      summary: Verifica dependencias obrigatorias
      tags: [Observability]
      responses:
        "200":
          description: Dependencias prontas
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Severity:
      type: string
      enum: [INFO, ATENCAO, MEDIO, ALTO, CRITICO]
    AlertStatus:
      type: string
      enum: [ABERTO, VISUALIZADO, EM_ANALISE, EM_EXECUCAO, RESOLVIDO, IGNORADO, CANCELADO]
